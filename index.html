<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cache-Cache GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #btn-fullscreen { background: #6c757d; }
        body { font-family: system-ui, sans-serif; text-align: center; margin: 0; padding: 10px; background: #f4f4f9; }
        #map { height: 55vh; width: 100%; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .user-config { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; background: white; padding: 10px; border-radius: 8px; }
        input[type="text"] { padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; text-align: center; }
        .file-label { padding: 8px; background: #e9ecef; border-radius: 6px; font-size: 14px; cursor: pointer; color: #495057; }
        input[type="file"] { display: none; }
        .btn-container { display: flex; gap: 10px; }
        button { flex: 1; padding: 14px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
        <button id="btn-fullscreen">Plein écran</button>
        #btn-start { background: #007bff; }
        #btn-stop { background: #dc3545; opacity: 0.5; }
        p { color: #666; font-size: 13px; margin-top: 8px; }

        /* Style des marqueurs personnalisés */
        .player-avatar-marker {
            text-align: center;
        }
        .player-avatar-marker img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid #007bff;
            object-fit: cover;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .player-avatar-marker .pseudo-tag {
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            white-space: nowrap;
            margin-top: -4px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h2>Cache-Cache GPS</h2>
    
    <div class="user-config" id="config-box">
        <input type="text" id="pseudo-input" placeholder="Ton Pseudo" value="Joueur">
        <label for="avatar-input" class="file-label" id="file-status">📷 Choisir une photo de profil</label>
        <input type="file" id="avatar-input" accept="image/*">
    </div>

    <div id="map"></div>

    <div class="btn-container">
        <button id="btn-start">Activer mon GPS</button>
        <button id="btn-stop" disabled>S'enlever du jeu</button>
    </div>
    <p id="status">Configure ton profil puis clique sur Activer</p>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('https://cache-cache-game.onrender.com'); 
        // 1. Définition des fonds de carte
const vueSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri'
});

const carteModerne = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap, &copy; CARTO'
});

const carteClassique = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
});

// 2. Initialisation avec la Vue Satellite par défaut
const map = L.map('map', {
    center: [48.8566, 2.3522],
    zoom: 13,
    layers: [vueSatellite] // Charge la vue satellite au démarrage
});

// 3. Ajout du bouton de sélection en haut à droite de la carte
const fondsDeCarte = {
    "🛰️ Vue Satellite": vueSatellite,
    "🗺️ Carte HD Moderne": carteModerne,
    "🌐 OpenStreetMap": carteClassique
};

L.control.layers(fondsDeCarte).addTo(map);
        

        let ownMarker = null;
        const otherMarkers = {};
        let watchID = null;
        let firstLocation = true;
        
        // Avatar par défaut (icône générique)
        let userAvatar = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

        // Convertir la photo importée en format léger (Base64)
        document.getElementById('avatar-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    userAvatar = event.target.result;
                    document.getElementById('file-status').innerText = "✅ Photo sélectionnée !";
                };
                reader.readAsDataURL(file);
            }
        });

        // Créer l'icône personnalisée avec la photo et le pseudo
        function createCustomIcon(pseudo, avatarUrl) {
            return L.divIcon({
                className: 'player-avatar-marker',
                html: `<div>
                        <img src="${avatarUrl || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}">
                        <br>
                        <span class="pseudo-tag">${pseudo}</span>
                       </div>`,
                iconSize: [50, 60],
                iconAnchor: [25, 30]
            });
        }

        // Afficher les joueurs déjà connectés
        socket.on('current_players', (players) => {
            for (let id in players) {
                if (id !== socket.id && !otherMarkers[id]) {
                    const p = players[id];
                    const icon = createCustomIcon(p.pseudo, p.avatar);
                    otherMarkers[id] = L.marker([p.lat, p.lng], { icon: icon }).addTo(map);
                }
            }
        });

        // Mise à jour ou création d'un joueur en mouvement
        socket.on('player_moved', (data) => {
            if (data.id === socket.id) return;
            const icon = createCustomIcon(data.pseudo, data.avatar);
            
            if (otherMarkers[data.id]) {
                otherMarkers[data.id].setLatLng([data.lat, data.lng]);
                otherMarkers[data.id].setIcon(icon);
            } else {
                otherMarkers[data.id] = L.marker([data.lat, data.lng], { icon: icon }).addTo(map);
            }
        });

        // Supprimer le joueur de la carte s'il quitte
        socket.on('player_left', (id) => {
            if (otherMarkers[id]) {
                map.removeLayer(otherMarkers[id]);
                delete otherMarkers[id];
            }
        });

        // Activer le GPS
        document.getElementById('btn-start').addEventListener('click', () => {
            if (!navigator.geolocation) return alert("GPS non supporté.");
            
            const pseudo = document.getElementById('pseudo-input').value.trim() || 'Joueur';

            firstLocation = true;
            watchID = navigator.geolocation.watchPosition((pos) => {
                const { latitude, longitude } = pos.coords;
                document.getElementById('status').innerText = `GPS Actif (${latitude.toFixed(4)}, ${longitude.toFixed(4)})`;

                const myIcon = createCustomIcon(pseudo + ' (Moi)', userAvatar);

                if (!ownMarker) {
                    ownMarker = L.marker([latitude, longitude], { icon: myIcon }).addTo(map);
                } else {
                    ownMarker.setLatLng([latitude, longitude]);
                    ownMarker.setIcon(myIcon);
                }

                if (firstLocation) {
                    map.setView([latitude, longitude], 17);
                    firstLocation = false;
                }

                // Envoi des infos au serveur
                socket.emit('update_position', { 
                    lat: latitude, 
                    lng: longitude, 
                    pseudo: pseudo, 
                    avatar: userAvatar 
                });
            }, (err) => alert("Active la localisation sur ton téléphone !"), { enableHighAccuracy: true });

            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-start').style.opacity = '0.5';
            document.getElementById('btn-stop').disabled = false;
            document.getElementById('btn-stop').style.opacity = '1';
            document.getElementById('pseudo-input').disabled = true;
            document.getElementById('avatar-input').disabled = true;
        });

        // Désactiver le GPS / Quitter
        document.getElementById('btn-stop').addEventListener('click', () => {
            if (watchID) navigator.geolocation.clearWatch(watchID);
            if (ownMarker) {
                map.removeLayer(ownMarker);
                ownMarker = null;
            }
            socket.emit('leave_game');
            document.getElementById('status').innerText = "Vous avez quitté la carte.";
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-start').style.opacity = '1';
            document.getElementById('btn-stop').disabled = true;
            document.getElementById('btn-stop').style.opacity = '0.5';
            document.getElementById('pseudo-input').disabled = false;
            document.getElementById('avatar-input').disabled = false;
        });

    const btnFullscreen = document.getElementById('btn-fullscreen');
btnFullscreen.addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert("Plein écran non supporté"));
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
});

document.addEventListener('fullscreenchange', () => {
    btnFullscreen.innerText = document.fullscreenElement ? "Réduire" : "Plein écran";
});
        
    </script>
</body>
</html>
