<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cache-Cache GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 10px; background: #f4f4f9; }
        #map { height: 65vh; width: 100%; border-radius: 12px; margin-bottom: 10px; }
        .btn-container { display: flex; gap: 10px; }
        button { flex: 1; padding: 15px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
        #btn-start { background: #007bff; }
        #btn-stop { background: #dc3545; opacity: 0.5; }
        p { color: #666; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Cache-Cache GPS</h2>
    <div id="map"></div>
    <div class="btn-container">
        <button id="btn-start">Activer mon GPS</button>
        <button id="btn-stop" disabled>S'enlever du jeu</button>
    </div>
    <p id="status">Cliquez sur Activer pour démarrer</p>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        // Remplace par ton adresse Render réelle !
        const socket = io('https://cache-cache-game.onrender.com/'); 

        const map = L.map('map').setView([48.8566, 2.3522], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let ownMarker = null;
        const otherMarkers = {};
        let watchID = null;
        let firstLocation = true;

        // Charger tous les joueurs déjà connectés lors de l'arrivée
        socket.on('current_players', (players) => {
            for (let id in players) {
                if (id !== socket.id && !otherMarkers[id]) {
                    otherMarkers[id] = L.marker([players[id].lat, players[id].lng]).addTo(map).bindPopup('Autre Joueur');
                }
            }
        });

        // Mise à jour ou ajout d'un joueur en direct
        socket.on('player_moved', (data) => {
            if (data.id === socket.id) return;
            if (otherMarkers[data.id]) {
                otherMarkers[data.id].setLatLng([data.lat, data.lng]);
            } else {
                otherMarkers[data.id] = L.marker([data.lat, data.lng]).addTo(map).bindPopup('Autre Joueur');
            }
        });

        // Supprimer le marqueur d'un joueur parti
        socket.on('player_left', (id) => {
            if (otherMarkers[id]) {
                map.removeLayer(otherMarkers[id]);
                delete otherMarkers[id];
            }
        });

        // Démarrer la géolocalisation
        document.getElementById('btn-start').addEventListener('click', () => {
            if (!navigator.geolocation) return alert("GPS non supporté.");
            
            firstLocation = true;
            watchID = navigator.geolocation.watchPosition((pos) => {
                const { latitude, longitude } = pos.coords;
                document.getElementById('status').innerText = `GPS actif : ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
                
                if (!ownMarker) {
                    ownMarker = L.marker([latitude, longitude]).addTo(map).bindPopup("Moi").openPopup();
                } else {
                    ownMarker.setLatLng([latitude, longitude]);
                }

                if (firstLocation) {
                    map.setView([latitude, longitude], 17);
                    firstLocation = false;
                }
                
                socket.emit('update_position', { lat: latitude, lng: longitude });
            }, (err) => alert("Active la localisation sur ton téléphone !"), { enableHighAccuracy: true });

            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-start').style.opacity = '0.5';
            document.getElementById('btn-stop').disabled = false;
            document.getElementById('btn-stop').style.opacity = '1';
        });

        // Arrêter le partage
        document.getElementById('btn-stop').addEventListener('click', () => {
            if (watchID) navigator.geolocation.clearWatch(watchID);
            if (ownMarker) {
                map.removeLayer(ownMarker);
                ownMarker = null;
            }
            socket.emit('leave_game');
            document.getElementById('status').innerText = "Vous avez quitté la carte.";
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-start').style.opacity = '1';
            document.getElementById('btn-stop').disabled = true;
            document.getElementById('btn-stop').style.opacity = '0.5';
        });
    </script>
</body>
</html>
